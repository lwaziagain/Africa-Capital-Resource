<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ACS responsive layout check</title>
<style>body{margin:0;background:#eceef2;color:#172039;font:15px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{display:flex;gap:8px;align-items:center}select,button{padding:9px;font:inherit}#stage{overflow:auto;padding:12px}iframe{border:1px solid #bcc1cc;background:white;transform-origin:top left;display:block}#result{padding:12px;margin:0;background:white}a{color:#3830a1}</style>
<header><strong>ACS layout check</strong><label>Screen width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Page<select id="page"><option value="home">Homepage</option><option value="cat-latest">Latest news</option><option value="cat-markets">Markets</option><option value="saved">Saved stories</option></select></label><button id="check">Check layout</button><a href="../">Open website</a></header>
<p id="result" role="status">Loading website…</p><div id="stage"><iframe id="site" title="Website at selected screen width" width="390" height="844" src="../index.html#home"></iframe></div>
<script>
const site=document.getElementById('site'),width=document.getElementById('width'),page=document.getElementById('page');
function size(){const w=+width.value;site.width=w;site.height=w<700?844:950;const scale=Math.min(1,(innerWidth-26)/w);site.style.transform=`scale(${scale})`;document.getElementById('stage').style.height=(+site.height*scale+24)+'px';check()}
function check(){try{const d=site.contentDocument;const overflow=d.documentElement.scrollWidth>d.documentElement.clientWidth+1;const failed=[...d.querySelectorAll('img[data-story-image]')].filter(i=>i.complete&&!i.naturalWidth&&!i.hidden).length;document.getElementById('result').textContent=`${width.value}px · Page overflow: ${overflow?'YES':'none'} · Failed loaded story images: ${failed} · ${d.querySelectorAll('[data-save-story]').length} save controls`;}catch{document.getElementById('result').textContent='Waiting for the website to load.'}}
width.addEventListener('change',size);page.addEventListener('change',()=>{site.src='../index.html#'+page.value});document.getElementById('check').addEventListener('click',check);site.addEventListener('load',size);addEventListener('resize',size);size();
</script></html>
